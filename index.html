<html lang="pt-BR">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Título e descrição que aparecem na aba do navegador e nos resultados de busca. -->

  <meta property="og:title" content="Econverse | Vitrine de produtos" />
  <meta property="og:description"
    content="Conheça a vitrine de produtos da Econverse: celulares, acessórios, tablets e muito mais." />

  <!-- Fontes do projeto (Poppins, Work Sans e Outfit), carregadas pelo Google Fonts. -->

    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Work+Sans:wght@400;500;600&family=Outfit:wght@600&display=swap"
